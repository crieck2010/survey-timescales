  season: null
  trend_years: 20
  trend_basis: "MODIS/FIRMS active-fire era 2001-present."
  event_density: {min_count: 50, target_count: 200, max_count: 500,
                  min_window_days: 7, max_window_days: 180,
                  lull_threshold_per_day: 1.0}
  notes: "Event variable: default sizes the trailing window to the target band. Region-specific seasons below."

