# ------------------------------------------- earthquakes (ComCat) --
- variable: earthquakes
  region: null
  source: comcat
  long_name: Earthquake events
  modes: [event-density, trend]
  default_mode: event-density
  cycle_period_days: null
  cadence_days: 1
  season: null
  trend_years: 50
  trend_basis: "USGS ComCat instrumental record is reasonably complete for M>=5 globally since the 1960s."
  event_density: {min_count: 20, target_count: 60, max_count: 200,
                  min_window_days: 1, max_window_days: 365,
                  lull_threshold_per_day: 0.1}
  notes: "ComCat catalogs observed events, not forecasts; the window sizes to the target band. No seasonality is assumed."

# ------------------------------------------------- static underlays --
