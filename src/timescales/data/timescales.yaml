# Timeframe registry for the survey remote-sensing suite.
#
# Curated, shipped-with-the-package data (no network, no LLM). Each entry
# maps a (variable, region, source) triple to the characteristic timescales
# a sensible map-reel window is built from: dominant cycles, climatological
# season bounds, trend horizons, and event-density bands.
#
# Conventions:
# - "variable" uses the canonical survey-viz variable keys (see
#   survey-viz/src/viz/spec.py KNOWN_VARIABLES; "chlorophyll" is the
#   legacy alias of "ocean-color").
# - "region" uses the survey-viz gazetteer region keys
#   (survey-viz/src/viz/data/regions.yaml); null = global default for the
#   variable, used when no region-specific entry exists.
# - "source" uses the survey-viz adapter keys (KNOWN_SOURCES in
#   survey-viz/src/viz/spec.py). "tp" exists under two sources ("era5" and
#   "imerg"); pass source= to disambiguate.
# - cycle_period_days is the dominant period in days (365.25 for the
#   annual cycle, accounting for leap years).
# - A season has start/end as month/day; wrap seasons (Oct->Mar) span a
#   year boundary. "basis" records the source of the season bounds.
# - static: true marks a time-invariant underlay (GEBCO basemaps) -> the
#   engine raises rather than suggest a window.
entries:

# ---------------------------------------------------------------- SST --
- variable: sst
  region: null
  source: oisst
  long_name: Sea surface temperature
  modes: [cycle, season, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Annual insolation cycle drives SST's dominant mode almost everywhere."
  cadence_days: 1
  season: null
  trend_years: 40
  trend_basis: "NOAA OISST record runs 1981-present."
  event_density: null
  notes: "Global OISST record is complete daily from 1981; annual cycle is the default framing."

# -------------------------------------------------------- ERA5 (t2m) --
- variable: t2m
  region: null
  source: era5
  long_name: 2-m air temperature
  modes: [cycle, season, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Annual insolation cycle."
  cadence_days: 1
  season: null
  trend_years: 30
  trend_basis: "ERA5 record 1940-present; 30 yr matches the WMO climate-normal convention."
  event_density: null
  notes: "Seasonal temperature framing (e.g. summer heat) can be added per region later."

# -------------------------------------------------------- ERA5 (wind) --
- variable: wind
  region: null
  source: era5
  long_name: 10-m wind
  modes: [cycle, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Mid-latitude wind regimes follow the annual storm-track cycle."
  cadence_days: 1
  season: null
  trend_years: 30
  trend_basis: "ERA5 record 1940-present."
  event_density: null
  notes: "Trade-wind / monsoon regions have a semi-annual (182.6 d) harmonic; data-driven detection will pick that up when a series is supplied."

# --------------------------------------------------------- ERA5 (msl) --
- variable: msl
  region: null
  source: era5
  long_name: Mean sea-level pressure
  modes: [cycle, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Semi-permanent pressure systems migrate annually."
  cadence_days: 1
  season: null
  trend_years: 30
  trend_basis: "ERA5 record 1940-present."
  event_density: null

# ---------------------------------------------------------- ERA5 (tp) --
- variable: tp
  region: null
  source: era5
  long_name: Total precipitation (ERA5)
  modes: [cycle, season, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Annual cycle dominates precipitation climatology in most regions."
  cadence_days: 1
  season: null
  trend_years: 30
  trend_basis: "ERA5 record 1940-present."
  event_density: null
  notes: "Disambiguate from IMERG tp with source='imerg'."

# -------------------------------------------------------- IMERG (tp) --
- variable: tp
  region: null
  source: imerg
  long_name: Precipitation (IMERG)
  modes: [cycle, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Annual cycle dominates precipitation climatology in most regions."
  cadence_days: 1
  season: null
  trend_years: 25
  trend_basis: "IMERG record runs 2000-present."
  event_density: null
  notes: "Disambiguate from ERA5 tp with source='era5'."

# ----------------------------------------------------- currents (OSCAR) --
- variable: currents
  region: null
  source: oscar
  long_name: Ocean surface currents
  modes: [cycle, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Boundary currents and the global gyre circulation follow the annual wind-stress cycle."
  cadence_days: 5
  season: null
  trend_years: 20
  trend_basis: "OSCAR record 1992-present; multi-decadal trend framing is approximate."
  event_density: null

