# ---------------------------------------------------- sea-ice (NSIDC) --
- variable: sea-ice
  region: null
  source: nsidc
  long_name: Sea-ice extent / concentration
  modes: [cycle, season, trend]
  default_mode: cycle
  cycle_period_days: 365.25
  cycle_basis: "Annual freeze-thaw cycle."
  cadence_days: 1
  season: {name: "Arctic melt season", start_month: 6, start_day: 1,
           end_month: 9, end_day: 30,
           basis: "NSIDC Arctic Sea Ice News: melt season runs June-September, with the September minimum; used as the default melt-season window for polar regions."}
  trend_years: 40
  trend_basis: "NSIDC satellite record starts October 1978; a 40-yr window covers essentially the full record."
  event_density: null
  notes: "Registry season applies to arctic-ocean; for southern-ocean the annual cycle still holds but the melt window is inverted — callers should pass a series or explicit dates there."

# ------------------------------------------ night-lights (Black Marble) --
- variable: night-lights
  region: null
  source: blackmarble
  long_name: Nighttime lights
  modes: [trend, cycle]
  default_mode: trend
  cycle_period_days: 365.25
  cycle_basis: "Weak annual cycle in illumination geometry; trend is the primary framing."
  cadence_days: 30
  season: null
  trend_years: 12
  trend_basis: "VIIRS Day/Night Band Black Marble record runs 2012-present."
  event_density: null
  notes: "Default is the full instrument era: there is no meaningful 'cycle' window for lights change-detection."

